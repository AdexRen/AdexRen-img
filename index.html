<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdexRen — Image Converter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0b1329;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background-color: #1e293b;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 4px;
      color: #38bdf8;
      letter-spacing: -0.5px;
    }
    p.subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 8px;
      font-weight: 500;
    }
    input[type="file"], select, input[type="color"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="file"]:focus, select:focus {
      border-color: #38bdf8;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #0284c7;
      cursor: pointer;
    }
    .checkbox-group label {
      margin-bottom: 0;
      cursor: pointer;
    }
    .color-picker-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type="color"] {
      height: 42px;
      padding: 4px;
      cursor: pointer;
    }
    .preview-container {
      margin: 20px 0;
      display: none;
      text-align: left;
    }
    .preview-title {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .preview-box {
      width: 100%;
      height: 200px;
      border-radius: 10px;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      /* Fondo tipo ajedrez para previsualizar transparencia */
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      background-image: linear-gradient(45deg, #0f172a 25%, transparent 25%), 
                        linear-gradient(-45deg, #0f172a 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #0f172a 75%), 
                        linear-gradient(-45deg, transparent 75%, #0f172a 75%);
    }
    .preview-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0369a1;
    }
    button:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>AdexRen</h1>
    <p class="subtitle" id="subTitleText">Image Converter</p>

    <div class="input-group">
      <label for="imageInput" id="labelSelect">Selecciona una imagen:</label>
      <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp, image/gif, image/avif, image/bmp, image/x-icon">
    </div>

    <!-- Vista previa en tiempo real -->
    <div class="preview-container" id="previewContainer">
      <div class="preview-title" id="labelPreview">Vista previa:</div>
      <div class="preview-box">
        <img id="previewImg" src="" alt="Preview">
      </div>
    </div>

    <div class="input-group">
      <label for="formatSelect" id="labelFormat">Convertir a:</label>
      <select id="formatSelect">
        <option value="png">PNG</option>
        <option value="webp">WEBP</option>
        <option value="jpeg">JPG / JPEG</option>
        <option value="avif">AVIF</option>
        <option value="gif">GIF</option>
        <option value="bmp">BMP</option>
        <option value="x-icon">ICO (Icono)</option>
      </select>
    </div>

    <!-- Relleno de fondo activo para formatos transparentes -->
    <div class="input-group" id="bgColorGroup">
      <div class="checkbox-group">
        <input type="checkbox" id="fillBgCheckbox">
        <label for="fillBgCheckbox" id="labelFillBg">Reemplazar transparencia con color sólido</label>
      </div>
      <div class="color-picker-container" id="colorPickerBox" style="display: none;">
        <input type="color" id="bgColor" value="#ffffff">
      </div>
    </div>

    <button id="convertBtn">Convertir y Descargar</button>
  </div>

  <canvas id="canvas" style="display: none;"></canvas>

  <script>
    const translations = {
      es: {
        subtitle: "Convertidor de Imágenes",
        selectLabel: "Selecciona una imagen:",
        previewLabel: "Vista previa del archivo:",
        formatLabel: "Convertir a:",
        fillBgLabel: "Aplanar transparencia con color de fondo",
        btnText: "Convertir y Descargar",
        alertSelect: "Por favor, selecciona una imagen primero."
      },
      en: {
        subtitle: "Image Converter",
        selectLabel: "Select an image:",
        previewLabel: "File Preview:",
        formatLabel: "Convert to:",
        fillBgLabel: "Flatten transparency with background color",
        btnText: "Convert & Download",
        alertSelect: "Please select an image first."
      }
    };

    const userLang = navigator.language.startsWith('es') ? 'es' : 'en';
    const t = translations[userLang];

    document.getElementById('subTitleText').textContent = t.subtitle;
    document.getElementById('labelSelect').textContent = t.selectLabel;
    document.getElementById('labelPreview').textContent = t.previewLabel;
    document.getElementById('labelFormat').textContent = t.formatLabel;
    document.getElementById('labelFillBg').textContent = t.fillBgLabel;
    document.getElementById('convertBtn').textContent = t.btnText;

    const imageInput = document.getElementById('imageInput');
    const formatSelect = document.getElementById('formatSelect');
    const bgColorGroup = document.getElementById('bgColorGroup');
    const fillBgCheckbox = document.getElementById('fillBgCheckbox');
    const colorPickerBox = document.getElementById('colorPickerBox');
    const bgColorInput = document.getElementById('bgColor');
    const convertBtn = document.getElementById('convertBtn');
    const previewContainer = document.getElementById('previewContainer');
    const previewImg = document.getElementById('previewImg');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Formatos con soporte nativo de transparencia
    const transparentFormats = ['png', 'webp', 'avif', 'gif', 'x-icon'];

    function updateControls() {
      const isTransparentFormat = transparentFormats.includes(formatSelect.value);
      
      // El reemplazo de transparencia solo aplica si el formato destino permite capa alfa
      if (isTransparentFormat) {
        bgColorGroup.style.display = 'block';
      } else {
        bgColorGroup.style.display = 'none';
        fillBgCheckbox.checked = false;
        colorPickerBox.style.display = 'none';
      }
    }

    fillBgCheckbox.addEventListener('change', () => {
      colorPickerBox.style.display = fillBgCheckbox.checked ? 'block' : 'none';
    });

    formatSelect.addEventListener('change', updateControls);
    updateControls();

    // Renderizado de vista previa al seleccionar archivo
    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          previewImg.src = e.target.result;
          previewContainer.style.display = 'block';
        };
        reader.readAsDataURL(file);
      } else {
        previewContainer.style.display = 'none';
      }
    });

    convertBtn.addEventListener('click', () => {
      const file = imageInput.files[0];
      if (!file) {
        alert(t.alertSelect);
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let width = img.width;
          let height = img.height;
          const targetFormat = formatSelect.value;

          // Ajuste de dimensión si se exporta a ICO
          if (targetFormat === 'x-icon') {
            width = Math.min(width, 256);
            height = Math.min(height, 256);
          }

          canvas.width = width;
          canvas.height = height;

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // Rellenar fondo sólido solo si el usuario lo activó explícitamente o si es JPG/BMP
          if (fillBgCheckbox.checked || !transparentFormats.includes(targetFormat)) {
            ctx.fillStyle = fillBgCheckbox.checked ? bgColorInput.value : '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }

          ctx.drawImage(img, 0, 0, width, height);

          const mimeType = targetFormat === 'x-icon' ? 'image/x-icon' : `image/${targetFormat}`;
          const dataUrl = canvas.toDataURL(mimeType, 0.95);

          let ext = targetFormat;
          if (targetFormat === 'jpeg') ext = 'jpg';
          if (targetFormat === 'x-icon') ext = 'ico';

          const originalName = file.name.substring(0, file.name.lastIndexOf('.')) || 'image';
          const link = document.createElement('a');
          link.download = `${originalName}_adexren.${ext}`;
          link.href = dataUrl;
          link.click();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  </script>

</body>
      </html>
